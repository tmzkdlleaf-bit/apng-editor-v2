[package]
name = "apng-editor"
version = "0.1.0"
description = "코코포리아 APNG 에디터"
edition = "2021"
rust-version = "1.77.2"

# 앱 버전은 tauri.conf.json 이 package.json 에서 읽는다. 이 crate 버전과는 별개다.

[lib]
name = "apng_editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! 매크로가 plugins(updater) 설정을 직렬화할 때 serde_json 을 직접 참조한다.
serde_json = "1"
# 파일 쓰기/읽기는 fs 플러그인 대신 커스텀 명령(std::fs)으로 한다 → 임의 드라이브 경로 저장 가능, 스코프 설정 불필요.

# ── 자동 업데이트(데스크톱 전용). lib.rs 의 setup 에서 플러그인을 등록하고,
#    tauri.conf.json 의 bundle.createUpdaterArtifacts·plugins.updater 로 설정한다.
#    실제 릴리스에는 서명 키가 필요하다(docs/release.md 참고). 빌드만 할 때는 산출물 생성을 끈다.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
